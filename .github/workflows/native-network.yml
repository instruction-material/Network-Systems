name: Network Systems native source

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [proxy-identity, capstone-optional, diagnostics-five, dns-optional, ufw-optional, routing-capture-optional, routing-optional, capture-optional, full]
        default: dns-optional
        description: Native source scope
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare ordinary Linux lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 iptables util-linux curl openssh-client dnsutils traceroute tcpdump ufw netcat-openbsd lsof dnsmasq-base
      - name: Check source inventory
        run: ./verify-course-source.sh
      - name: Exercise real owned Linux sockets and independent analyses
        run: python3 test/verify_foundations.py --proof output/network-foundations.json
      - name: Exercise addressing, system name lookup and prefix boundary labs
        run: python3 test/verify_naming.py --proof output/network-addressing.json
      - name: Exercise real IPv6 endpoints and independent prefix analysis
        run: python3 test/verify_ipv6.py --proof output/network-ipv6.json
      - name: Exercise actual application responses, validators and content boundaries
        run: python3 test/verify_applications.py --proof output/network-applications.json
      - name: Exercise bounded HTTP and TCP reachability diagnostics
        run: python3 test/verify_reachability.py --proof output/network-reachability.json
      - name: Exercise passive TCP and UDP listener inventories
        run: python3 test/verify_listeners.py --proof output/network-listeners.json
      - name: Exercise owned DNS answers and separate system name service
        run: python3 test/verify_resolution.py --proof output/network-resolution.json
      - name: Exercise isolated forwarding, real NAT and interruption cleanup
        run: sudo python3 test/verify_topology.py --proof output/network-topology.json
      - name: Exercise owned bridges, gateway restoration and translated endpoint views
        run: sudo python3 test/verify_link_routing.py --proof output/network-link-routing.json
      - name: Exercise owned HTTP packet captures and bounded cleanup
        run: sudo python3 test/verify_capture.py --proof output/network-capture.json
      - name: Exercise owned UFW allowances, denial, rollback and interruption
        run: sudo python3 test/verify_ufw.py --proof output/network-ufw.json
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-foundations-source
          path: output/
          if-no-files-found: error
          retention-days: 7

  native-capstone:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the owned routed-capstone tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 iptables util-linux curl dnsutils tcpdump dnsmasq-base
      - name: Check source inventory
        run: ./verify-course-source.sh
      - name: Verify actual capstone routing, DNS, proxy, policy, packet evidence and cleanup
        run: sudo python3 test/verify_capstone.py --proof output/network-capstone.json
      - name: Retain capstone source and native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-capstone-source
          path: output/
          if-no-files-found: error
          retention-days: 7

  native-setup-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the ordinary-user command tracing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 bash strace
      - name: Check source inventory
        run: ./verify-course-source.sh
      - name: Verify actual command context, shell argument boundaries and cleanup
        run: python3 test/verify_setup_optional.py --proof output/network-setup-optional.json
      - name: Retain setup source and native execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-setup-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 7

  native-transport-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the ordinary-user socket tracing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 strace
      - name: Check source inventory
        run: ./verify-course-source.sh
      - name: Verify application record framing, UDP queue observations and cleanup
        run: python3 test/verify_transport_optional.py --proof output/network-transport-optional.json
      - name: Retain transport source and native socket evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-transport-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 7

  native-listener-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare ordinary-user socket inventory and tracing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 strace
      - name: Check source inventory
        run: ./verify-course-source.sh
      - name: Verify UDP views, inherited TCP listener owners and cleanup
        run: python3 test/verify_listener_optional.py --proof output/network-listener-optional.json
      - name: Retain listener source and native inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-listener-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 7

  native-dns-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'dns-optional'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare ordinary-user DNS and process tracing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 dnsutils dnsmasq-base strace
      - name: Check DNS result boundaries and case validation
        run: python3 test/test_dns_optional.py
      - name: Verify actual role commands, decoded DNS packets and process cleanup
        run: python3 test/verify_dns_optional.py --proof output/network-dns-optional.json
      - name: Retain source, raw DNS wire data and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-dns-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 7


  native-ufw-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'ufw-optional'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the owned firewall lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ufw iproute2 iptables util-linux curl
      - name: Check passive countdowns and actual address-change controls
        run: python3 -B test/test_ufw_host_state.py
      - name: Check optional role sources and unchanged isolation apparatus
        run: python3 -B test/verify_ufw_optional.py --source-only --proof output/source/network-ufw-optional.json
      - name: Verify changed management ports, profile exposure, corrections and rollback
        run: sudo python3 -B test/verify_ufw_optional.py --proof output/native/network-ufw-optional.json
      - name: Verify the core UFW project with the same corrected host comparison
        run: sudo python3 -B test/verify_ufw.py --proof output/core/network-ufw-core.json
      - name: Make owned native evidence readable by the artifact publisher
        if: always()
        run: |
          if [ -d output ]; then sudo chmod -R a+rX output; fi
      - name: Retain original source, requests, rules and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-ufw-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 14


  native-routing-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'routing-capture-optional' || inputs.scope == 'routing-optional'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the owned kernel lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 iptables util-linux curl
      - name: Verify source inventory and unchanged qualified apparatus
        run: python3 -B test/verify_routing_optional.py --source-only --proof output/source/routing-optional.json
      - name: Verify actual task failures, corrections, observations and cleanup
        run: sudo python3 -B test/verify_routing_optional.py --proof output/native/routing-optional.json
      - name: Make owned evidence readable by the artifact publisher
        if: always()
        run: |
          if [ -d output ]; then sudo chmod -R a+rX output; fi
      - name: Retain original observed kernel and process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-routing-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 14


  native-capture-optional:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'routing-capture-optional' || inputs.scope == 'capture-optional'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the owned kernel lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 iptables util-linux tcpdump
      - name: Verify source inventory and unchanged qualified apparatus
        run: python3 -B test/verify_capture_optional.py --source-only --proof output/source/capture-optional.json
      - name: Verify actual task failures, corrections, observations and cleanup
        run: sudo python3 -B test/verify_capture_optional.py --proof output/native/capture-optional.json
      - name: Make owned evidence readable by the artifact publisher
        if: always()
        run: |
          if [ -d output ]; then sudo chmod -R a+rX output; fi
      - name: Retain original observed kernel and process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-capture-optional-source
          path: output/
          if-no-files-found: error
          retention-days: 14


  native-diagnostics-five:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'diagnostics-five'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare owned ordinary-user diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 curl netcat-openbsd coreutils strace
      - name: Verify actual failures, one-field corrections, changed cases and cleanup
        run: python3 -B test/verify_diagnostics_five.py --proof output/diagnostics-five/native.json
      - name: Retain original commands, socket syscalls, reports and process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-diagnostics-five-native
          path: output/
          if-no-files-found: error
          retention-days: 30

  native-proxy-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'proxy-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare owned routed-capstone and syscall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 iptables util-linux curl dnsutils tcpdump dnsmasq-base strace
      - name: Reproduce historical incorrect proxy-target acceptance
        run: sudo python3 -B test/verify_capstone_proxy_identity.py --expect-wrong-accepted --proof output/proxy-identity.json
      - name: Retain exact source, syscall, packet and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-proxy-identity
          path: output/
          if-no-files-found: error
          retention-days: 7
