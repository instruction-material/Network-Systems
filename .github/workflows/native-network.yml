name: Network foundations native source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare ordinary Linux lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iproute2 iptables util-linux curl openssh-client dnsutils traceroute tcpdump ufw
      - name: Check source inventory
        run: ./verify-course-source.sh
      - name: Exercise real owned Linux sockets and independent analyses
        run: python3 test/verify_foundations.py --proof output/network-foundations.json
      - name: Exercise addressing, system name lookup and prefix boundary labs
        run: python3 test/verify_naming.py --proof output/network-addressing.json
      - name: Exercise isolated forwarding, real NAT and interruption cleanup
        run: sudo python3 test/verify_topology.py --proof output/network-topology.json
      - name: Exercise owned HTTP packet captures and bounded cleanup
        run: sudo python3 test/verify_capture.py --proof output/network-capture.json
      - name: Exercise owned UFW allowances, denial, rollback and interruption
        run: sudo python3 test/verify_ufw.py --proof output/network-ufw.json
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-foundations-source
          path: output/
          if-no-files-found: error
          retention-days: 7
